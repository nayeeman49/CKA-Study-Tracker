# Fly.io config. Change `app` to a unique name (or let `fly launch` pick one).
app = "cka-tracker-demo"
primary_region = "lhr"

[build]

[env]
  PORT = "3000"
  DATA_DIR = "/data"
  COOKIE_SECURE = "1"

[mounts]
  source = "cka_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
